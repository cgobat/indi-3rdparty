name: QSI Debian Packages

on:
  workflow_dispatch:

jobs:
  build-qsi-debs:
    name: Build QSI Debian packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Get INDI 3rd Party Sources
        uses: actions/checkout@v6
        with:
          path: indi-3rdparty

      - name: Install Build Dependencies
        run: |
          $(command -v sudo) apt-get update
          $(command -v sudo) apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            debhelper \
            dpkg-dev \
            fakeroot \
            git \
            gnupg \
            libcfitsio-dev \
            libcurl4-gnutls-dev \
            libftdi1-2 \
            libftdi1-dev \
            libnova-dev \
            libusb-1.0-0-dev \
            pkg-config

      - name: Add StellarMate Repository
        run: |
          set -e
          $(command -v sudo) install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://ppa.stellarmate.com/repos/apt/conf/sm.gpg.key | $(command -v sudo) gpg --dearmor -o /etc/apt/keyrings/stellarmate.gpg
          echo "deb [signed-by=/etc/apt/keyrings/stellarmate.gpg] https://ppa.stellarmate.com/repos/apt/stable noble main" | $(command -v sudo) tee /etc/apt/sources.list.d/stellarmate.list
          $(command -v sudo) apt-get update

      - name: Install INDI Core Packages
        run: |
          $(command -v sudo) apt-get install -y --no-install-recommends indi-bin libindi-dev

      - name: Build QSI Debian Packages
        run: |
          set -e
          mkdir -p deb-artifacts
          cd indi-3rdparty

          # Append the UTC build timestamp to the package versions so
          # artifacts from different workflow runs are distinguishable.
          deb_build_timestamp="$(date -u +%Y%m%d%H%M%S)"
          DEB_BUILD_TIMESTAMP="$deb_build_timestamp" perl -0pi -e 's/^(\S+ \()([^\)]+)(\) .*)$/$1$2+$ENV{DEB_BUILD_TIMESTAMP}$3/m' \
            debian/libqsi/changelog \
            debian/indi-qsi/changelog

          # The libqsi Debian metadata still names the old runtime package
          # libftdi1. Current Ubuntu images provide libftdi1-2.
          find debian/libqsi -type f \
            -exec sed -i 's/libftdi1\b/libftdi1-2/g' {} +

          ./make_deb_pkgs libqsi
          cp libqsi*.deb ../deb-artifacts/
          $(command -v sudo) dpkg -i ../deb-artifacts/libqsi*.deb

          ./make_deb_pkgs indi-qsi
          cp indi-qsi*.deb ../deb-artifacts/

      - name: Upload QSI Debian Packages
        uses: actions/upload-artifact@v7
        with:
          name: indi-qsi-deb-ubuntu-${{ matrix.arch }}
          path: deb-artifacts/*.deb
          if-no-files-found: error
